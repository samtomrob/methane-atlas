notes: >
  Safeguard table has per-facility "GHG Methane" and "GHG Nitrous oxide"
  (tCO2-e) columns — the reported-vs-observed join. NGER methods data shows
  each facility's fugitive-CH4 estimation Method (1–4). No coordinates —
  name/operator fuzzy join to map features with one-time manual review.
  Exact CSV URLs change yearly; probe the hub pages.
