[project]
name = "matlas"
version = "0.1.0"
description = "Methane Atlas data pipeline: fetch, composite, tile, publish"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "earthengine-api>=1.1",
    "boto3>=1.35",
    "numpy>=2.5.2",
    "xarray>=2026.7.0",
    "netcdf4>=1.7.4",
    "rasterio>=1.5.1",
]

[project.scripts]
matlas = "matlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matlas"]
