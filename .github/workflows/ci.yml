name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  pipeline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
        working-directory: pipeline
      - run: uv run python -c "import matlas.infra, matlas.probe, matlas.geo, matlas.tropomi, matlas.render, matlas.auth"
        working-directory: pipeline
      - run: uv run python tests/test_render.py
        working-directory: pipeline
